<style>

.chip .av{font-size:10px}
.t .ok{color:var(--ac);font-weight:700}
.who{display:flex;flex-direction:column;gap:6px}.wr{display:flex;align-items:center;gap:8px}
.card{background:var(--bar);margin:10px;padding:14px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card .big{font-size:30px;font-weight:700}
.sec{padding:12px 14px 4px;color:var(--sub);font-size:13px;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bar);border-bottom:1px solid var(--bd);cursor:pointer}
.srow .st{flex:1;min-width:0}.srow small{display:block;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--bg);padding:4px 12px;border-radius:12px;font-weight:600;white-space:nowrap}
.pr{display:flex;gap:6px;width:100%}.pr input{flex:1;min-width:0;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;text-transform:uppercase}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{background:var(--bg);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}.gi.off{opacity:.45}
.m.gf{background:linear-gradient(135deg,#ffd6e7,#fff1b8);color:#222;text-align:center}
.m.gf .ge{font-size:64px;line-height:1.1}.m.gf .gp{font-weight:700;color:#d6336c}.m.gf .t{color:#555}
.ph{background:#000d}.ph img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:8px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fp{position:absolute;will-change:transform,opacity}
.fpop{position:absolute;left:50%;top:42%;font-size:120px;animation:pop 2.4s ease-out forwards}
@keyframes fup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) translateX(var(--sx)) scale(1.2);opacity:0}}
@keyframes fdn{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(112vh) translateX(var(--sx)) rotate(var(--r));opacity:.9}}
@keyframes fbs{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.3)}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
.m.gf .gn{font-style:italic;margin:4px 0}
</style>

<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,setDoc,getDoc,getDocs,writeBatch,updateDoc,deleteDoc,arrayUnion,arrayRemove,FieldPath,serverTimestamp,query,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoWv-mPq93B7o3HSOwLB0uAh6sleDxpG8",
  authDomain: "messendger-89532.firebaseapp.com",
  projectId: "messendger-89532",
  storageBucket: "messendger-89532.firebasestorage.app",
  messagingSenderId: "444765553703",
  appId: "1:444765553703:web:7aff1a18d6471afb1e7a02"
};
const NTFY_URL="https://ntfy.sh";
const NTFY_PREVIEW=false; // true: текст сообщения виден в пуше (пройдёт через сервер ntfy.sh)

// =====================================================================
// ПРОМОКОДЫ — СЮДА ДОБАВЛЯЙ СВОИ
// Формат строки:  "КОД": сколько_сердечек,
// Регистр не важен. Каждый код активируется один раз на одном устройстве.
// Чтобы убрать промокод — удали его строку.
// =====================================================================
const PROMOS={
  "WELCOME":50,
  "LOVE":100,
  "KSENYA":1401,
  "LUBLU":67,
  "KITTY":2807,
  "KISS":5,
  "GOD":90000,
  // "МОЙКОД":25,   <- пример: добавь новую строку по этому образцу
};
// =====================================================================
// ПОДАРКИ — СЮДА ДОБАВЛЯЙ СВОИ
// id  — уникальное имя латиницей (не меняй у старых подарков!)
// e   — эмодзи, n — название, p — цена в сердечках
// fx  — эффект при отправке: "float" (всплывают), "rain" (дождь),
//       "burst" (взрыв из центра), "confetti" (конфетти)
// =====================================================================
const GIFTS=[
  {id:"rose",e:"🌹",n:"Роза",p:5,fx:"float"},
  {id:"cake",e:"🍰",n:"Тортик",p:10,fx:"confetti"},
  {id:"bear",e:"🧸",n:"Мишка",p:15,fx:"float"},
  {id:"gift",e:"🎁",n:"Подарок",p:20,fx:"burst"},
  {id:"ring",e:"💍",n:"Кольцо",p:50,fx:"rain"},
  {id:"cup",e:"🏆",n:"Кубок",p:100,fx:"confetti"},
  {id:"heart",e:"💗",n:"Сердце",p:1000,fx:"rain"},
  // {id:"star",e:"⭐",n:"Звезда",p:30,fx:"burst"},   <- пример нового подарка
];
const PROMO_MAP=Object.fromEntries(Object.entries(PROMOS).map(([k,v])=>[k.trim().toUpperCase(),v]));
const giftBy=id=>GIFTS.find(g=>g.id===id);

const app=document.querySelector("#app");
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const J=(k,d)=>{try{return JSON.parse(LS.get(k))||d}catch(e){return d}};
const el=(t,p,c)=>{const e=document.createElement(t);Object.assign(e,p||{});(c||[]).forEach(x=>e.append(x));return e};
let db,uid,chats=J("chats",[]),profile=J("profile",{n:LS.get("name")||"",a:"",b:""});
const pa={},gm={};let mine={},stickHook=null;
let wallet={h:0,used:[]},myGifts=[],walletHook=null,chatApi=null,walletMsg="",walletErr="";
const opt=k=>localStorage.getItem(k)==="1";const setOpt=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}};
function applyTheme(){const t=LS.get("th")||"auto";if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
const last={},watchers={};let cur=null,view="home",unsubs=[],listEl=null,chipsEl=null;
if(!chats.length&&LS.get("room"))chats.push({c:LS.get("room"),t:LS.get("room"),r:0});
const save=()=>{LS.set("chats",JSON.stringify(chats));LS.set("profile",JSON.stringify(profile))};
const myTopic=LS.get("topic")||(()=>{const t="chat"+crypto.randomUUID().replace(/-/g,"").slice(0,20);LS.set("topic",t);return t})();
const norm=v=>v.trim().toLowerCase().replace(/[^a-zа-я0-9_-]/gi,"");
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");
const inviteLink=c=>location.href.split("#")[0]+"#"+c;

const T=x=>x&&x.ts&&x.ts.toMillis?{...x,ts:x.ts.toMillis()}:x;
const errText=(e,what)=>(what||"Не удалось отправить")+" ("+(e.code||e.message)+")"+(e.code==="resource-exhausted"?"\nДостигнут дневной лимит бесплатного тарифа Firebase, он сбросится в течение суток.":e.code==="permission-denied"?"\nПроверь, что последние правила Firestore опубликованы.":"");
function av(a,n,s){const d=el("div",{className:"av"});if(s)d.style.cssText="width:"+s+"px;height:"+s+"px;font-size:"+Math.round(s/2.3)+"px";
  if(a)d.append(el("img",{src:a}));else d.textContent=(n||"?").trim().charAt(0).toUpperCase();return d}
const ttl=ch=>ch.dm?(ch.nick||(pa[ch.c]?pa[ch.c].n:ch.t)):ch.t;
const cav=(ch,s)=>ch.dm?av((pa[ch.c]||{}).a,ttl(ch),s):av((gm[ch.c]||{}).a,ch.t,s);
function modal(build){const ov=el("div",{className:"ov",onclick:e=>{if(e.target===ov)ov.remove()}});const box=el("div",{className:"box"});ov.append(box);build(box,()=>ov.remove());document.body.append(ov)}
const btn=(t,f,c)=>el("button",{type:"button",className:"btn "+(c||""),textContent:t,onclick:f});
function loadImg(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(f)})}
async function shrink(f){const im=await loadImg(f),k=Math.min(1,900/Math.max(im.width,im.height));
  const c=el("canvas",{width:Math.round(im.width*k),height:Math.round(im.height*k)});c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.7)}
async function avatarData(f,size=128,q=.75){const im=await loadImg(f),m=Math.min(im.width,im.height),z=Math.min(size,m);
  const c=el("canvas",{width:z,height:z});c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);return c.toDataURL("image/jpeg",q)}
async function toSticker(f){const im=await loadImg(f);
  for(const mx of [256,192,128]){const k=Math.min(1,mx/Math.max(im.width,im.height));
    const c=el("canvas",{width:Math.round(im.width*k),height:Math.round(im.height*k)});c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    let u=c.toDataURL("image/webp",.85);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/png");if(u.length<140000)return u}
  throw new Error("big")}

function syncProfile(c){if(!profile.n)return;setDoc(doc(db,"chats",c,"members",uid),{n:profile.n,a:profile.a||"",b:profile.b||"",t:myTopic,ts:Date.now()},{merge:true}).catch(()=>{})}
function isUnread(c){const l=last[c],ch=chats.find(x=>x.c===c);return !!(l&&l.u!==uid&&l.ts>(ch?ch.r||0:0))}
function markRead(){const ch=chats.find(x=>x.c===cur);if(!ch)return;ch.r=Math.max(ch.r||0,last[cur]?last[cur].ts:0);save();renderChips()}
function watch(c){if(watchers[c])return;const ch=chats.find(x=>x.c===c),us=[];
  us.push(onSnapshot(query(collection(db,"chats",c,"messages"),orderBy("ts","desc"),limit(1)),s=>{last[c]=s.docs[0]?T(s.docs[0].data({serverTimestamps:"estimate"})):null;if(cur===c)markRead();paint()},()=>{}));
  if(ch&&ch.dm)us.push(onSnapshot(collection(db,"chats",c,"members"),s=>{s.docs.forEach(d=>{if(d.id===ch.dm)pa[c]={id:d.id,...d.data()}});paint()},()=>{}));
  else us.push(onSnapshot(doc(db,"chats",c,"meta","info"),s=>{gm[c]=s.exists()?s.data():{};paint()},()=>{}));
  watchers[c]=()=>us.forEach(u=>u())}
function paint(){view==="home"?renderList():renderChips()}

function editProfile(){modal((box,close)=>{
  const n=el("input",{placeholder:"Имя",value:profile.n,maxLength:30});
  const b=el("input",{placeholder:"О себе (необязательно)",value:profile.b||"",maxLength:120});
  let a=profile.a||"",af=null;const holder=el("div",{className:"c"});
  const show=()=>{holder.innerHTML="";holder.append(av(a,n.value||profile.n,88))};show();
  const f=el("input",{type:"file",accept:"image/*",hidden:true,onchange:async()=>{const x=f.files[0];f.value="";if(!x)return;try{a=await avatarData(x,128,.75);af=await avatarData(x,512,.85);show()}catch(e){alert("Не удалось загрузить фото")}}});
  box.append(el("h3",{textContent:"Мой профиль"}),holder,btn("Выбрать фото",()=>f.click(),"g"),n,b,f,
    btn("Сохранить",()=>{if(!n.value.trim()){alert("Введи имя");return}
      profile={n:n.value.trim(),a,b:b.value.trim()};save();chats.forEach(ch=>{watch(ch.c);syncProfile(ch.c)});
      if(af)setDoc(doc(db,"users",uid,"avatar","full"),{f:af}).catch(()=>{});
      close();if(view==="settings")settings();else if(view==="home")home();else openChat(cur)}))})}
const fullAva=id=>getDoc(doc(db,"users",id,"avatar","full")).then(s=>s.exists()?s.data().f:null);
const fullGroupAva=room=>getDoc(doc(db,"chats",room,"meta","full")).then(s=>s.exists()?s.data().f:null);
function showPhoto(thumb,loader){if(!thumb)return;
  const ov=el("div",{className:"ov ph",onclick:()=>ov.remove()}),im=el("img",{src:thumb});ov.append(im);document.body.append(ov);
  if(loader)Promise.resolve(loader()).then(x=>{if(x)im.src=x}).catch(()=>{})}
const viewAva=p=>showPhoto(p&&p.a,()=>p.id?fullAva(p.id):null);
function renameNick(ch){const v=prompt("Как назвать контакт у себя? Пусто — вернуть настоящее имя",ch.nick||ttl(ch));
  if(v===null)return;ch.nick=v.trim();save();paint();if(view==="chat"&&cur===ch.c)openChat(ch.c)}

function viewProfile(p,ch){modal((box,close)=>{
  const real=p.n||"Без имени",shown=ch&&ch.nick?ch.nick:real;
  const ava=av(p.a,p.n,110);ava.style.cursor="pointer";ava.onclick=()=>viewAva(p);
  const gl=el("div",{className:"who",style:"width:100%;text-align:left"});
  box.append(el("div",{className:"c"},[ava,el("h3",{textContent:shown}),
    ...(shown!==real?[el("div",{textContent:"Настоящее имя: "+real,style:"color:var(--sub);font-size:13px"})]:[]),
    el("div",{textContent:p.b||"Пока ничего о себе не рассказал(а)",style:"color:var(--sub)"}),gl]));
  if(p.id)getDocs(query(collection(db,"users",p.id,"gifts"),orderBy("ts","desc"),limit(300))).then(sn=>{const items=sn.docs.map(d=>d.data()).filter(x=>!x.h);if(!items.length)return;
