<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чат">
<title>Приватный чат</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef3;--bar:#fff;--me:#d9f4c4;--them:#fff;--tx:#111;--sub:#7a8794;--ac:#2a8bd8;--bd:#d6dde4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--bar:#17212b;--me:#2b5278;--them:#182533;--tx:#f2f5f7;--sub:#8596a6;--ac:#5eb5f7;--bd:#25323f}}
:root[data-theme="dark"]{--bg:#0e1621;--bar:#17212b;--me:#2b5278;--them:#182533;--tx:#f2f5f7;--sub:#8596a6;--ac:#5eb5f7;--bd:#25323f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{background:var(--bar);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
header b{flex:1}header small{display:block;color:var(--sub);font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ico{font-size:22px;padding:6px}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.m{max-width:80%;padding:6px 10px;border-radius:14px;background:var(--them);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me)}
.m .n{font-size:13px;font-weight:600;color:var(--ac)}
.m .t{font-size:11px;color:var(--sub);text-align:right}
.m img{max-width:100%;border-radius:10px;display:block;margin:2px 0}
.m.st{background:none;font-size:64px;line-height:1.1;padding:0}
#stk{display:none;background:var(--bar);padding:8px;border-top:1px solid var(--bd);flex-wrap:wrap;gap:2px}
#stk.on{display:flex}#stk button{font-size:34px;padding:4px 6px}
form{background:var(--bar);display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--bd)}
#txt{flex:1;border:0;outline:0;background:var(--bg);color:var(--tx);border-radius:18px;padding:9px 14px;font:inherit}
#go{color:var(--ac);font-size:22px;padding:6px 8px}
.login{margin:auto;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.login input{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bar);color:var(--tx);font:inherit}
.login .go{background:var(--ac);color:#fff;padding:12px;border-radius:12px;font-weight:600}
.login p{color:var(--sub);margin:0;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoWv-mPq93B7o3HSOwLB0uAh6sleDxpG8",
  authDomain: "messendger-89532.firebaseapp.com",
  projectId: "messendger-89532",
  storageBucket: "messendger-89532.firebasestorage.app",
  messagingSenderId: "444765553703",
  appId: "1:444765553703:web:7aff1a18d6471afb1e7a02"
};

const $=s=>document.querySelector(s), app=$("#app");
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const STICKERS=["😀","😂","🥰","😎","🤔","😭","🔥","❤️","👍","👎","🎉","🙏","😴","🤯","🥳","😡","🐱","🐶","🦄","🍕","☕","🚀","💩","👀"];
let db,uid,unsub,name=LS.get("name")||"",room=LS.get("room")||"";
const el=(t,p,c)=>{const e=document.createElement(t);Object.assign(e,p||{});(c||[]).forEach(x=>e.append(x));return e};

function login(){
  app.innerHTML="";
  const n=el("input",{placeholder:"Твоё имя",value:name,maxLength:30});
  const r=el("input",{placeholder:"Секретный код чата (длинный!)",value:room,maxLength:60});
  const b=el("button",{className:"go",textContent:"Войти",onclick:()=>{
    name=n.value.trim();room=r.value.trim().toLowerCase().replace(/[^a-zа-я0-9_-]/gi,"");
    if(!name||room.length<6){alert("Введи имя и код чата (минимум 6 символов)");return}
    LS.set("name",name);LS.set("room",room);chat();}});
  app.append(el("div",{className:"login"},[el("h2",{textContent:"Приватный чат"}),
    el("p",{textContent:"Кто знает код, тот в чате. Чем длиннее и случайнее код, тем надёжнее."}),n,r,b]));
}

function chat(){
  app.innerHTML="";
  const msgs=el("div",{id:"msgs"}), stk=el("div",{id:"stk"});
  const txt=el("input",{id:"txt",placeholder:"Сообщение",autocomplete:"off"});
  const file=el("input",{type:"file",accept:"image/*",hidden:true});
  const hd=el("header",{},[el("button",{className:"ico",textContent:"←",onclick:()=>{unsub&&unsub();login()}}),
    el("b",{},[document.createTextNode("# "+room),el("small",{textContent:"вы: "+name})])]);
  const form=el("form",{onsubmit:e=>{e.preventDefault();const v=txt.value.trim();if(!v)return;txt.value="";send({k:"t",x:v})}},[
    el("button",{type:"button",className:"ico",textContent:"📎",onclick:()=>file.click()}),
    el("button",{type:"button",className:"ico",textContent:"😊",onclick:()=>stk.classList.toggle("on")}),
    txt,el("button",{id:"go",textContent:"➤"}),file]);
  STICKERS.forEach(s=>stk.append(el("button",{type:"button",textContent:s,onclick:()=>{send({k:"s",x:s});stk.classList.remove("on")}})));
  app.append(hd,msgs,stk,form);

  const col=collection(db,"chats",room,"messages");
  const send=o=>addDoc(col,{...o,u:uid,n:name,ts:Date.now()}).catch(()=>alert("Не удалось отправить"));

  file.onchange=async()=>{const f=file.files[0];file.value="";if(!f)return;
    try{send({k:"i",x:await shrink(f)})}catch(e){alert("Не удалось обработать фото")}};

  unsub=onSnapshot(query(col,orderBy("ts"),limit(200)),s=>{
    const bottom=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<120;
    msgs.innerHTML="";
    s.docs.forEach(d=>{const m=d.data(),me=m.u===uid;
      const b=el("div",{className:"m"+(me?" me":"")+(m.k==="s"?" st":"")});
      if(!me&&m.k!=="s")b.append(el("div",{className:"n",textContent:String(m.n||"")}));
      if(m.k==="i"&&String(m.x).startsWith("data:image/"))b.append(el("img",{src:m.x}));
      else b.append(document.createTextNode(String(m.x)));
      b.append(el("div",{className:"t",textContent:new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}));
      msgs.append(b)});
    if(bottom||s.size<=30)msgs.scrollTop=msgs.scrollHeight;
  },e=>alert("Нет доступа к чату: "+e.code));
}

// Фото сжимаются и хранятся прямо в сообщении (бесплатно, без Firebase Storage)
function shrink(f){return new Promise((ok,no)=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));
    const c=el("canvas",{width:Math.round(im.width*k),height:Math.round(im.height*k)});
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};
  im.onerror=no;im.src=URL.createObjectURL(f)})}

try{
  const a=initializeApp(firebaseConfig);db=getFirestore(a);
  const cred=await signInAnonymously(getAuth(a));uid=cred.user.uid;
  name&&room.length>=6?chat():login();
}catch(e){app.innerHTML='';app.append(el("div",{className:"login"},[el("p",{textContent:"Не удалось подключиться к Firebase."}),el("p",{textContent:"Код ошибки: "+(e.code||"нет")+" | "+(e.message||String(e))})]))}
</script>
</body>
</html>
