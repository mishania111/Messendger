name: Sleep Mode Toggle

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать?'
        required: true
        default: 'sleep'
        type: choice
        options:
          - sleep
          - wake

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sleep mode
        if: github.event.inputs.action == 'sleep'
        run: |
          mv index.html index_real.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>Спит</title></head>
          <body style="background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:20vh;">
            <h1>🔒 МЕССЕНДЖЕР СПИТ</h1>
            <p>Владелец ушел. Возвращайся позже.</p>
          </body>
          </html>
          EOF

      - name: Wake mode
        if: github.event.inputs.action == 'wake'
        run: |
          mv index_real.html index.html

      - name: Commit
        run: |
          git config user.name "SleepBot"
          git config user.email "bot@sleep.com"
          git add -A
          git commit -m "Toggle sleep mode" || echo "no changes"
          git push
